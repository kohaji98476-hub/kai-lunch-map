<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ追加ツール</title>
<style>
  body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
  .card { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
  h2 { color: #173D8D; margin-bottom: 8px; }
  p { color: #666; font-size: 14px; margin-bottom: 8px; }
  #map { width: 100%; height: 200px; border-radius: 12px; margin-bottom: 16px; }
  button { padding: 14px 32px; background: #173D8D; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  button:disabled { background: #ccc; }
  #status { margin-top: 16px; font-size: 14px; font-weight: 600; }
  .success { color: #4CAF50; }
  .error { color: #e53935; }
</style>
</head>
<body>
<div class="card">
  <h2>🍜 データ追加ツール</h2>
  <p>「麦蕎麦 陸人」の位置を地図で確認してから追加します</p>
  <div id="map"></div>
  <p id="coords" style="font-size:12px;color:#888;"></p>
  <button id="btn" onclick="addReview()" disabled>地図読み込み中...</button>
  <div id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCHIxKeZr_iA_K9XSSgteZjez7TnZIk1CM",
    authDomain: "kai-lunch-map-d16d0.firebaseapp.com",
    projectId: "kai-lunch-map-d16d0",
    storageBucket: "kai-lunch-map-d16d0.firebasestorage.app",
    messagingSenderId: "107069095031",
    appId: "1:107069095031:web:0a107a881ae79b63dcda72",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._addDoc = addDoc;
  window._collection = collection;
</script>

<script>
let shopLat, shopLng, shopPlaceId, shopName, shopAddress;

window.initMap = async function() {
  const { Map } = await google.maps.importLibrary("maps");
  const { PlacesService, PlacesServiceStatus } = await google.maps.importLibrary("places");

  const map = new Map(document.getElementById('map'), {
    center: { lat: 35.6983, lng: 139.7747 },
    zoom: 17,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
  });

  const svc = new PlacesService(map);
  svc.findPlaceFromQuery(
    { query: '麦蕎麦 陸人 神田佐久間町', fields: ['name', 'formatted_address', 'geometry', 'place_id'] },
    (results, status) => {
      if (status === PlacesServiceStatus.OK && results[0]) {
        const place = results[0];
        shopLat = place.geometry.location.lat();
        shopLng = place.geometry.location.lng();
        shopPlaceId = place.place_id;
        shopName = place.name;
        shopAddress = place.formatted_address;

        map.setCenter({ lat: shopLat, lng: shopLng });
        new google.maps.Marker({ position: { lat: shopLat, lng: shopLng }, map });

        document.getElementById('coords').textContent = `📍 ${shopName} (${shopLat.toFixed(5)}, ${shopLng.toFixed(5)})`;
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = '追加する';
      } else {
        document.getElementById('coords').textContent = '⚠️ お店が見つかりませんでした';
      }
    }
  );
};

window.addReview = async function() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = '追加中...';

  try {
    await window._addDoc(window._collection(window._db, 'reviews'), {
      placeId: shopPlaceId,
      shopName: shopName,
      shopAddress: shopAddress,
      lat: shopLat,
      lng: shopLng,
      userName: "八代",
      ratings: { taste: 5, portion: 5, price: 4, ambience: 5, speed: 3 },
      walkMin: 7,
      genres: ["そば・うどん"],
      menu: "とろろ蕎麦",
      note: "うますぎ　日曜に行くと柴犬がいる　並んでも意外と時間かからない",
      createdAt: new Date().toISOString()
    });
    status.className = 'success';
    status.textContent = '✅ 追加しました！このページは閉じてOKです。';
  } catch(e) {
    status.className = 'error';
    status.textContent = '❌ エラー: ' + e.message;
    btn.disabled = false;
    btn.textContent = '追加する';
  }
};
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBp-ufjhkc9R3Fls-tRoGlXMAAsWGCzuxU&libraries=places&callback=initMap&loading=async" async defer></script>
</body>
</html>
