 3.0, "speed": 5.0, "note": "激得ポイントカード、廃止された説。値段Pは10→7に。※一回200円の火力があった"}, {"query": "千代田区神田花岡町1-1 ヨドバシカメラマルチメディアakiba 8F 居酒屋革命　酔っ手羽", "genre": "その他（和食以外）", "user": "八代", "menu": "茶色いもの", "taste": 3.0, "portion": 5.0, "price": 3.5, "ambience": 3.0, "speed": 4.0, "note": "空いてる割に提供はあまり早くない印象　味も普通"}, {"query": "台東区浅草橋1丁目２４−１高政ビル２階　小料理屋すなお", "genre": "その他和食", "user": "月本", "menu": "生姜焼き　チャーハン", "taste": 4.5, "portion": 4.0, "price": 3.5, "ambience": 5.0, "speed": 3.0, "note": "食後、階段下りて外までお見送りしてくれる　圧倒的感謝"}, {"query": "台東区浅草橋1丁目２４−１高政ビル２階　小料理屋すなお", "genre": "その他和食", "user": "臼田", "menu": "", "taste": 4.5, "portion": 4.0, "price": 3.0, "ambience": 5.0, "speed": 3.0, "note": ""}, {"query": "千代田区鍛冶町2丁目１０−１０Gc神田鍛冶町ビル　鬼金棒Lab", "genre": "ラーメン", "user": "月本", "menu": "", "taste": 4.0, "portion": 3.0, "price": 1.5, "ambience": 4.0, "speed": 5.0, "note": "コンセプトがおもろいでしょ！　(未完成品食わすのか(クレーマー))"}, {"query": "千代田区鍛冶町2丁目１０−１０Gc神田鍛冶町ビル　鬼金棒Lab", "genre": "ラーメン", "user": "八代", "menu": "牛骨ラーメン", "taste": 5.0, "portion": 5.0, "price": 0.5, "ambience": 5.0, "speed": 5.0, "note": "うまい！！！ベースはマイルドだけど卓上調味料で完全に鬼金棒のシビカラになる。高い！！！"}, {"query": "千代田区鍛冶町2丁目１０−１０Gc神田鍛冶町ビル　鬼金棒Lab", "genre": "ラーメン", "user": "臼田", "menu": "", "taste": 4.0, "portion": 4.0, "price": 1.0, "ambience": 4.0, "speed": 4.0, "note": ""}];
const OFFICE_LAT = 35.6969, OFFICE_LNG = 139.7782;

function calcWalkMin(lat, lng) {
  const R = 6371000;
  const dLat = (lat-OFFICE_LAT)*Math.PI/180, dLng = (lng-OFFICE_LNG)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(OFFICE_LAT*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.max(1, Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1.3/80));
}

function addLog(msg, cls='') {
  const div = document.createElement('div');
  div.className = cls; div.textContent = msg;
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = 99999;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function searchPlace(query, svc) {
  return new Promise(resolve => {
    svc.findPlaceFromQuery(
      { query, fields: ['name','formatted_address','geometry','place_id'] },
      (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results?.[0]) {
          const p = results[0];
          resolve({ placeId: p.place_id, name: p.name, address: p.formatted_address, lat: p.geometry.location.lat(), lng: p.geometry.location.lng() });
        } else resolve(null);
      }
    );
  });
}

window.initMap = async function() {
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = '登録開始';
};

window.startImport = async function() {
  document.getElementById('startBtn').disabled = true;
  const { collection, addDoc } = window._fns;

  const mapDiv = document.createElement('div');
  mapDiv.style.cssText = 'width:1px;height:1px;position:fixed;top:0;left:0;';
  document.body.appendChild(mapDiv);
  const { Map } = await google.maps.importLibrary("maps");
  const { PlacesService } = await google.maps.importLibrary("places");
  const map = new Map(mapDiv, { center: { lat: OFFICE_LAT, lng: OFFICE_LNG }, zoom: 15 });
  const svc = new PlacesService(map);

  // 店名ごとにグループ化（同じqueryのお店はまとめてPlace検索）
  const shopGroups = {};
  RECORDS.forEach(r => {
    if (!shopGroups[r.query]) shopGroups[r.query] = { place: null, records: [] };
    shopGroups[r.query].records.push(r);
  });

  addLog(, 'info');

  for (const [query, group] of Object.entries(shopGroups)) {
    const place = await searchPlace(query, svc);
    if (place) {
      group.place = place;
      addLog(, 'ok');
    } else {
      addLog(, 'skip');
    }
    await sleep(300);
  }

  addLog('=== Firebaseに登録中 ===', 'info');
  let done = 0, saved = 0, skipped = 0;
  const total = RECORDS.length;

  for (const [query, group] of Object.entries(shopGroups)) {
    for (const rec of group.records) {
      done++;
      if (!group.place) {
        addLog(, 'skip');
        skipped++;
      } else {
        const walkMin = calcWalkMin(group.place.lat, group.place.lng);
        try {
          await addDoc(collection(window._db, 'reviews'), {
            placeId: group.place.placeId,
            shopName: group.place.name,
            shopAddress: group.place.address,
            lat: group.place.lat, lng: group.place.lng,
            userName: rec.user,
            ratings: { taste: rec.taste, portion: rec.portion, price: rec.price, ambience: rec.ambience, speed: rec.speed },
            walkMin, genres: [rec.genre], menu: rec.menu, note: rec.note,
            createdAt: new Date().toISOString(),
          });
          saved++;
          addLog(, 'ok');
        } catch(e) {
          addLog(, 'err');
        }
        await sleep(50);
      }
      const pct = Math.round(done / total * 100);
      document.getElementById('prog-bar').style.width = pct + '%';
      document.getElementById('prog-text').textContent = ;
    }
  }

  addLog(, 'ok');
};
</script>
