<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>徒歩時間更新ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
  .card { background: white; border-radius: 16px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  h2 { color: #173D8D; margin-bottom: 8px; }
  p { color: #666; font-size: 14px; margin-bottom: 16px; }
  button { padding: 12px 24px; background: #173D8D; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .progress-bar { background: #eee; border-radius: 10px; height: 12px; margin: 12px 0; }
  .progress-fill { background: #173D8D; border-radius: 10px; height: 12px; width: 0%; transition: width 0.3s; }
  #log { margin-top: 16px; max-height: 400px; overflow-y: auto; font-size: 12px; font-family: monospace; background: #f9f9f9; border-radius: 8px; padding: 12px; }
  .log-ok { color: #4CAF50; }
  .log-skip { color: #FF9800; }
</style>
</head>
<body>
<div class="card">
  <h2>🚶 徒歩時間一括更新ツール</h2>
  <p>walkMinがnullのレビューに、会社からの直線距離で計算した徒歩時間を自動設定します。</p>
  <button id="startBtn" onclick="startFix()">更新開始</button>
  <div class="progress-bar"><div class="progress-fill" id="prog-bar"></div></div>
  <div id="prog-text" style="font-size:13px;color:#666;">待機中...</div>
  <div id="log"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyCHIxKeZr_iA_K9XSSgteZjez7TnZIk1CM",
    authDomain: "kai-lunch-map-d16d0.firebaseapp.com",
    projectId: "kai-lunch-map-d16d0",
    storageBucket: "kai-lunch-map-d16d0.firebasestorage.app",
    messagingSenderId: "107069095031",
    appId: "1:107069095031:web:0a107a881ae79b63dcda72",
  });
  const db = getFirestore(app);
  window._db = db;
  window._fns = { collection, getDocs, doc, updateDoc };
</script>

<script>
const OFFICE_LAT = 35.6969;
const OFFICE_LNG = 139.7782;

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcWalkMin(lat, lng) {
  return Math.max(1, Math.round(calcDistance(OFFICE_LAT, OFFICE_LNG, lat, lng)*1.3/80));
}

function addLog(msg, cls='') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = 99999;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

window.startFix = async function() {
  document.getElementById('startBtn').disabled = true;
  const { collection, getDocs, doc, updateDoc } = window._fns;

  addLog('Firebaseからデータ取得中...');
  const snap = await getDocs(collection(window._db, 'reviews'));
  const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const targets = all.filter(r => r.walkMin === null || r.walkMin === undefined);

  addLog(`全${all.length}件中、walkMin未設定: ${targets.length}件`);

  let done = 0, updated = 0;
  for (const r of targets) {
    done++;
    const walkMin = calcWalkMin(r.lat, r.lng);
    try {
      await updateDoc(doc(window._db, 'reviews', r.id), { walkMin });
      updated++;
      addLog(`✅ ${r.shopName} / ${r.userName} → ${walkMin}分`, 'log-ok');
    } catch(e) {
      addLog(`❌ ${r.shopName} / ${r.userName}: ${e.message}`);
    }
    const pct = Math.round(done / targets.length * 100);
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-text').textContent = `${done} / ${targets.length}件 処理済み`;
    await sleep(50);
  }

  addLog(`=== 完了！${updated}件を更新しました ===`, 'log-ok');
};
</script>
</body>
</html>
