// 店名ごとにまとめてPlaces検索
let placeCache = {}; // shopName -> {placeId, lat, lng, address, name} or null
let notFound = [];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function addLog(msg, cls='') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = 99999;
}

function searchPlace(shopName, svc) {
  return new Promise(resolve => {
    svc.findPlaceFromQuery(
      { query: shopName + ' 秋葉原 岩本町', fields: ['name','formatted_address','geometry','place_id'] },
      (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results && results[0]) {
          const p = results[0];
          resolve({
            placeId: p.place_id,
            name: p.name,
            address: p.formatted_address,
            lat: p.geometry.location.lat(),
            lng: p.geometry.location.lng(),
          });
        } else {
          resolve(null);
        }
      }
    );
  });
}

window.startImport = async function() {
  document.getElementById('startBtn').disabled = true;
  const total = RECORDS.length;
  document.getElementById('prog-text').textContent = '0 / ' + total;

  const mapDiv = document.createElement('div');
  mapDiv.style.display = 'none';
  document.body.appendChild(mapDiv);
  const { Map } = await google.maps.importLibrary("maps");
  const { PlacesService } = await google.maps.importLibrary("places");
  const map = new Map(mapDiv, { center: { lat: 35.698, lng: 139.775 }, zoom: 15 });
  const svc = new PlacesService(map);

  // 店名一覧を重複排除してPlaces検索
  const shopNames = [...new Set(RECORDS.map(r => r.shop))];
  addLog('=== お店を検索中 (' + shopNames.length + '店) ===');

  for (const shopName of shopNames) {
    const result = await searchPlace(shopName, svc);
    if (result) {
      placeCache[shopName] = result;
      addLog('✅ 見つかった: ' + shopName + ' → ' + result.name, 'log-ok');
    } else {
      placeCache[shopName] = null;
      notFound.push(shopName);
      addLog('⚠️ 見つからない: ' + shopName, 'log-skip');
    }
    await sleep(200);
  }

  addLog('=== Firebaseに登録中 ===');

  let done = 0, skipped = 0, saved = 0;
  for (const rec of RECORDS) {
    done++;
    const place = placeCache[rec.shop];
    if (!place) {
      addLog('スキップ: ' + rec.shop + ' / ' + rec.user + ' (お店不明)', 'log-skip');
      skipped++;
    } else {
      try {
        await window._addDoc(window._collection(window._db, 'reviews'), {
          placeId: place.placeId,
          shopName: place.name,
          shopAddress: place.address,
          lat: place.lat,
          lng: place.lng,
          userName: rec.user,
          ratings: {
            taste: rec.taste,
            portion: rec.portion,
            price: rec.price,
            ambience: rec.ambience,
            speed: rec.speed,
          },
          walkMin: null,
          genres: [rec.genre],
          menu: rec.menu,
          note: rec.note,
          createdAt: new Date().toISOString(),
        });
        saved++;
        addLog('登録: ' + rec.shop + ' / ' + rec.user, 'log-ok');
      } catch(e) {
        addLog('エラー: ' + rec.shop + ' / ' + rec.user + ' - ' + e.message, 'log-err');
      }
      await sleep(50);
    }

    const pct = Math.round(done / total * 100);
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-text').textContent = done + ' / ' + total;
  }

  addLog('=== 完了! 登録: ' + saved + '件 / スキップ: ' + skipped + '件 ===', 'log-ok');

  if (notFound.length > 0) {
    document.getElementById('not-found').style.display = 'block';
    document.getElementById('not-found-list').innerHTML = notFound.map(s => '・' + s).join('<br>');
  }
};
</script>
