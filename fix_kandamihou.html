<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>神田味坊修正ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
  .card { background: white; border-radius: 16px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  h2 { color: #173D8D; margin-bottom: 8px; }
  p { color: #666; font-size: 14px; margin-bottom: 16px; }
  button { padding: 12px 24px; background: #173D8D; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #log { margin-top: 16px; max-height: 500px; overflow-y: auto; font-size: 12px; font-family: monospace; background: #f9f9f9; border-radius: 8px; padding: 12px; }
  .log-ok { color: #4CAF50; }
  .log-err { color: #e53935; }
  .log-info { color: #173D8D; }
</style>
</head>
<body>
<div class="card">
  <h2>🔧 神田味坊データ修正ツール</h2>
  <p>「神田 味坊」のplaceId・座標・住所が「香福味坊」と混在しているデータを修正します。</p>
  <p>
    ・香福味坊：千代田区神田佐久間町1丁目21-1<br>
    ・神田 味坊：千代田区鍛冶町2丁目11-20
  </p>
  <br>
  <button id="startBtn" onclick="startFix()">修正開始</button>
  <div id="log"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const app = initializeApp({
    apiKey: "AIzaSyCHIxKeZr_iA_K9XSSgteZjez7TnZIk1CM",
    authDomain: "kai-lunch-map-d16d0.firebaseapp.com",
    projectId: "kai-lunch-map-d16d0",
    storageBucket: "kai-lunch-map-d16d0.firebasestorage.app",
    messagingSenderId: "107069095031",
    appId: "1:107069095031:web:0a107a881ae79b63dcda72",
  });
  const db = getFirestore(app);
  window._db = db;
  window._fns = { collection, getDocs, doc, updateDoc };
</script>

<script>
function addLog(msg, cls='') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = msg;
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = 99999;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Places APIで神田味坊を検索して正しい情報を取得
function searchPlace(query, svc) {
  return new Promise(resolve => {
    svc.findPlaceFromQuery(
      { query, fields: ['name','formatted_address','geometry','place_id'] },
      (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results?.[0]) {
          const p = results[0];
          resolve({ placeId: p.place_id, name: p.name, address: p.formatted_address, lat: p.geometry.location.lat(), lng: p.geometry.location.lng() });
        } else resolve(null);
      }
    );
  });
}

window.initMap = async function() {};

window.startFix = async function() {
  document.getElementById('startBtn').disabled = true;
  const { collection, getDocs, doc, updateDoc } = window._fns;

  // Maps初期化
  const mapDiv = document.createElement('div');
  mapDiv.style.cssText = 'width:1px;height:1px;position:fixed;top:0;left:0;';
  document.body.appendChild(mapDiv);
  const { Map } = await google.maps.importLibrary("maps");
  const { PlacesService, PlacesServiceStatus } = await google.maps.importLibrary("places");
  const map = new Map(mapDiv, { center: { lat: 35.698, lng: 139.775 }, zoom: 15 });
  const svc = new PlacesService(map);

  // 神田味坊の正しい情報をPlaces APIで取得
  addLog('神田味坊を検索中...', 'log-info');
  const kandaPlace = await searchPlace('神田 味坊 鍛冶町 千代田区', svc);
  if (!kandaPlace) {
    addLog('❌ 神田味坊が見つかりませんでした', 'log-err');
    return;
  }
  addLog(`✅ 神田味坊: ${kandaPlace.name} (${kandaPlace.lat.toFixed(5)}, ${kandaPlace.lng.toFixed(5)})`, 'log-ok');
  addLog(`   住所: ${kandaPlace.address}`, 'log-info');

  await sleep(300);

  // 香福味坊の正しい情報も取得
  addLog('香福味坊を検索中...', 'log-info');
  const koufukuPlace = await searchPlace('香福味坊 神田佐久間町 千代田区', svc);
  if (!koufukuPlace) {
    addLog('❌ 香福味坊が見つかりませんでした', 'log-err');
    return;
  }
  addLog(`✅ 香福味坊: ${koufukuPlace.name} (${koufukuPlace.lat.toFixed(5)}, ${koufukuPlace.lng.toFixed(5)})`, 'log-ok');
  addLog(`   住所: ${koufukuPlace.address}`, 'log-info');

  await sleep(300);

  // Firebaseから全データ取得
  addLog('Firebaseからデータ取得中...', 'log-info');
  const snap = await getDocs(collection(window._db, 'reviews'));
  const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  // 「神田 味坊」という店名のレビューを抽出（香福味坊のplaceIdになっているもの）
  const kandaReviews = all.filter(r =>
    r.shopName && (r.shopName.includes('味坊') && !r.shopName.includes('香福'))
  );
  const koufukuReviews = all.filter(r =>
    r.shopName && r.shopName.includes('香福味坊')
  );

  addLog(`神田味坊レビュー: ${kandaReviews.length}件`, 'log-info');
  addLog(`香福味坊レビュー: ${koufukuReviews.length}件`, 'log-info');

  // 神田味坊のレビューを正しい情報に更新
  addLog('--- 神田味坊を修正中 ---', 'log-info');
  for (const r of kandaReviews) {
    const walkMin = calcWalkMin(kandaPlace.lat, kandaPlace.lng);
    try {
      await updateDoc(doc(window._db, 'reviews', r.id), {
        placeId: kandaPlace.placeId,
        shopName: kandaPlace.name,
        shopAddress: kandaPlace.address,
        lat: kandaPlace.lat,
        lng: kandaPlace.lng,
        walkMin,
      });
      addLog(`✅ 修正: ${r.shopName} / ${r.userName} → ${kandaPlace.name} (${walkMin}分)`, 'log-ok');
    } catch(e) {
      addLog(`❌ エラー: ${r.shopName} / ${r.userName}: ${e.message}`, 'log-err');
    }
    await sleep(100);
  }

  // 香福味坊のレビューも正しい情報に更新
  addLog('--- 香福味坊を修正中 ---', 'log-info');
  for (const r of koufukuReviews) {
    const walkMin = calcWalkMin(koufukuPlace.lat, koufukuPlace.lng);
    try {
      await updateDoc(doc(window._db, 'reviews', r.id), {
        placeId: koufukuPlace.placeId,
        shopName: koufukuPlace.name,
        shopAddress: koufukuPlace.address,
        lat: koufukuPlace.lat,
        lng: koufukuPlace.lng,
        walkMin,
      });
      addLog(`✅ 修正: ${r.shopName} / ${r.userName} → ${koufukuPlace.name} (${walkMin}分)`, 'log-ok');
    } catch(e) {
      addLog(`❌ エラー: ${r.shopName} / ${r.userName}: ${e.message}`, 'log-err');
    }
    await sleep(100);
  }

  addLog('=== 完了！ ===', 'log-ok');
};

function calcWalkMin(lat, lng) {
  const OFFICE_LAT = 35.6969, OFFICE_LNG = 139.7782;
  const R = 6371000;
  const dLat = (lat-OFFICE_LAT)*Math.PI/180;
  const dLng = (lng-OFFICE_LNG)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(OFFICE_LAT*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)**2;
  const dist = R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return Math.max(1, Math.round(dist*1.3/80));
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBp-ufjhkc9R3Fls-tRoGlXMAAsWGCzuxU&libraries=places&callback=initMap&loading=async" async defer></script>
</body>
</html>
