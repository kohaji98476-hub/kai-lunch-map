function addLog(msg, cls='') {
  const div = document.createElement('div');
  div.className = cls; div.textContent = msg;
  document.getElementById('log').appendChild(div);
  document.getElementById('log').scrollTop = 99999;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

window.startFix = async function() {
  document.getElementById('startBtn').disabled = true;
  const { collection, getDocs, doc, updateDoc } = window._fns;

  addLog('Firebaseからデータ取得中...', 'info');
  const snap = await getDocs(collection(window._db, 'reviews'));
  const allReviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  addLog('取得完了: ' + allReviews.length + '件', 'info');

  let updated = 0, skipped = 0, done = 0;
  const total = CORRECT_RECORDS.length;

  for (const correct of CORRECT_RECORDS) {
    done++;
    // FirebaseでshopNameとuserNameが一致するレビューを探す
    const match = allReviews.find(r => {
      const shopMatch = r.shopName && (
        r.shopName.includes(correct.shop) || correct.shop.includes(r.shopName) ||
        r.shopName === correct.shop
      );
      return shopMatch && r.userName === correct.user;
    });

    if (!match) {
      addLog('スキップ（見つからない）: ' + correct.shop + ' / ' + correct.user, 'skip');
      skipped++;
    } else {
      try {
        await updateDoc(doc(window._db, 'reviews', match.id), {
          ratings: {
            taste: correct.taste,
            portion: correct.portion,
            price: correct.price,
            ambience: correct.ambience,
            speed: correct.speed,
          }
        });
        updated++;
        addLog('✅ 修正: ' + correct.shop + ' / ' + correct.user +
          ' [量:' + correct.portion + ' 値段:' + correct.price +
          ' 雰囲気:' + correct.ambience + ' 混雑:' + correct.speed + ']', 'ok');
      } catch(e) {
        addLog('❌ エラー: ' + correct.shop + ' / ' + correct.user + ' - ' + e.message, 'err');
      }
      await sleep(50);
    }

    const pct = Math.round(done / total * 100);
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-text').textContent = done + ' / ' + total + '件処理済み';
  }

  addLog('=== 完了！更新: ' + updated + '件 / スキップ: ' + skipped + '件 ===', 'ok');
};
